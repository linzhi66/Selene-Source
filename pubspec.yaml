name: selene
description: "基于 MoonTV 的视频播放器"
# 如需发布到 pub.dev 请删除此行
publish_to: 'none'
# 以下定义应用的版本和构建号
version: 1.6.6+2156
environment:
  sdk: '>=3.4.3 <4.0.0'
# 依赖项指定项目所需其他包
dependencies:
  app_settings: ^7.0.0
  bitsdojo_window: ^0.1.6
  bs58check: ^1.0.2
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  dlna_dart: ^0.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  gal: ^2.3.0
  gbk_codec: ^0.4.0
  google_fonts: ^8.0.0
  gpt_markdown: ^1.1.4
  http: ^1.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.0
  macos_window_utils: ^1.5.1
  media_kit: 1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.3
  encrypt: ^5.0.3
  file_selector: ^1.1.0
  pip: ^0.0.3
  provider: ^6.1.2
  screen_brightness: ^2.1.7
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.0
  volume_controller: ^3.4.0
  web_socket_channel: ^3.0.3
  xml: ^6.5.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
# 以下部分特定于 Flutter 包
flutter:
  # 以下行确保 Material Icons 字体包含在应用中
  # 以便在 material Icons 类中使用图标
  uses-material-design: true
  generate: true
# 应用图标配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  # 移除 iOS 图标的透明通道
  remove_alpha_ios: true
  # Android 最低 SDK 版本（最小:16，默认:21）
  min_sdk_android: 21
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "logo.png"
    # 图标尺寸（最小:48，最大:256，默认:48）
    icon_size: 48
  macos:
    generate: true
    image_path: "logo.png"